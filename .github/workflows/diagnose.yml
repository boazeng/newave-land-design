name: Diagnose EC2

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "===== systemctl status ====="
            sudo systemctl status newave --no-pager -l | head -30 || true
            echo "===== journalctl (last 60) ====="
            sudo journalctl -u newave -n 60 --no-pager || true
            echo "===== try importing the app directly ====="
            cd /opt/newave-land-design/backend
            /opt/newave-land-design/venv/bin/python -c "import main; print('IMPORT OK')" 2>&1 | tail -25 || true
            echo "===== unit file ====="
            sudo systemctl cat newave --no-pager || true
            echo "===== env file presence ====="
            ls -la /opt/env/.env /opt/newave-land-design/env/.env 2>&1 || true
            echo "===== data/projects.json ====="
            ls -la /opt/newave-land-design/data/projects.json 2>&1 || true
