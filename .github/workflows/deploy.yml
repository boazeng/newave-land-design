name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: SHAREPOINT_TENANT_ID,SHAREPOINT_CLIENT_ID,SHAREPOINT_CLIENT_SECRET
          script: |
            set -e
            cd /opt/newave-land-design
            # Preserve large data files that are deployed directly (not via git)
            mkdir -p /tmp/data_backup
            cp data/plans_*.json /tmp/data_backup/ 2>/dev/null || true
            cp data/projects.json /tmp/data_backup/ 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            # Restore preserved data files
            cp /tmp/data_backup/plans_*.json data/ 2>/dev/null || true
            cp /tmp/data_backup/projects.json data/ 2>/dev/null || true
            # Write env file with secrets
            sudo mkdir -p /opt/env
            sudo tee /opt/env/.env > /dev/null <<EOF
            SHAREPOINT_TENANT_ID=${SHAREPOINT_TENANT_ID}
            SHAREPOINT_CLIENT_ID=${SHAREPOINT_CLIENT_ID}
            SHAREPOINT_CLIENT_SECRET=${SHAREPOINT_CLIENT_SECRET}
            EOF
            sudo chmod 600 /opt/env/.env
            sudo chown ec2-user:ec2-user /opt/env/.env
            # Setup Python venv
            if [ ! -f venv/bin/activate ]; then
              rm -rf venv
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -q -r backend/requirements.txt
            # Install Node.js if missing
            if ! command -v npm &> /dev/null; then
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
              sudo yum install -y nodejs
            fi
            # Build frontend
            cd frontend
            npm install --silent
            npm run build
            cd ..
            # Import the app on the server's own Python before touching the running
            # service. Catches syntax/deps that pass locally but not here (the server
            # is older than dev), while the current version is still serving.
            (cd backend && python -c "import main") || {
              echo "::error::backend failed to import - not restarting, previous version left running"
              exit 1
            }
            # Restart services
            sudo systemctl restart newave
            sudo systemctl reload nginx
            # A restart 'succeeds' even if the process crashes a moment later, so ask
            # the service whether it is actually serving.
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8001/api/health || true)
              [ "$code" = "200" ] && break
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "::error::backend unhealthy after restart (last status: ${code:-no response})"
              sudo journalctl -u newave -n 40 --no-pager || true
              exit 1
            fi
            echo "Deploy completed - backend healthy"
